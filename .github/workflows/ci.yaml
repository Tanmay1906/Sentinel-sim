name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black pytest pytest-cov pytest-mock httpx fastapi uvicorn pydantic pyyaml loguru elasticsearch

    - name: Run Black Linter Check
      run: black --check . --exclude .venv

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run pytest with Coverage
      env:
        PYTHONPATH: "backend:."
        SECRET_KEY: "mock_secret_key_mock_secret_key_mock_secret_key"
        ELASTICSEARCH_URL: "http://localhost:9200"
        ELASTICSEARCH_PASSWORD: "elastic"
      run: |
        python -m pytest --cov=backend/app --cov=simulator tests/ --cov-report=term-missing
